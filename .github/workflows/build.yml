# =============================================================================
# GKI 内核构建工作流
# -----------------------------------------------------------------------------
# 核心构建逻辑已抽取至 scripts/build_kernel.sh（与 Python CLI build.py 共用），
# 本文件只保留 GitHub Actions 专属能力：缓存、产物上传、失败日志、Telegram 通知。
# 修改构建逻辑请改 scripts/build_kernel.sh，不要在本文件里重写 shell。
# =============================================================================
name: 内核构建流程
permissions:
  contents: write
  actions: write
'on':
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_variant:
        required: true
        type: string
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制）"
        required: false
        type: string
        default: 关闭
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: r1
      build_time:
        required: false
        type: string
        default: Thu Sep 17 00:00:00 UTC 2026
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: '不启用'
      artifact_upload_mode:
        required: false
        type: string
        default: 上传全部
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      use_bbr:
        description: 设置 BBR 为默认拥塞算法
        required: false
        type: boolean
        default: false
      send_telegram:
        description: 发送 Telegram 通知（需配置 secrets）
        required: false
        type: boolean
        default: false
      use_release_cache:
        description: 用 GitHub Release 存储 ccache
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
      kpm_patch_sha256:
        description: "KPM 修补工具 sha256 锚点（留空不校验）"
        required: false
        type: string
        default: ""
jobs:
  build-kernel:
    name: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v7
    - name: 应用自定义提交
      if: ${{ inputs.sukisu_commit != '' || inputs.susfs_commit != '' }}
      # 安全：所有外部输入一律经 env 传入，run 块中不得出现 ${{ }}。
      # ${{ }} 在 shell 解析之前完成文本替换，直接内插会形成 Actions 注入面。
      env:
        SUKISU_COMMIT: ${{ inputs.sukisu_commit }}
        SUSFS_COMMIT: ${{ inputs.susfs_commit }}
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
      run: |
        set -eu
        SUSFS_BRANCH="gki-$ANDROID_VERSION-$KERNEL_VERSION"
        SUSFS_BRANCH_ESC="${SUSFS_BRANCH//./\\.}"
        echo "目标 SUSFS 分支键名: $SUSFS_BRANCH"
        # 仅接受纯 40/64 位十六进制 commit hash，杜绝 sed 表达式注入
        if [ -n "$SUKISU_COMMIT" ]; then
          case "$SUKISU_COMMIT" in
            *[!0-9a-fA-F]*|'') echo "::error::非法的 SukiSU commit: $SUKISU_COMMIT"; exit 1 ;;
          esac
          [ "${#SUKISU_COMMIT}" = "40" ] || [ "${#SUKISU_COMMIT}" = "64" ] || {
            echo "::error::commit 长度必须为 40 或 64 位: $SUKISU_COMMIT"; exit 1; }
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          case "$SUSFS_COMMIT" in
            *[!0-9a-fA-F]*|'') echo "::error::非法的 SUSFS commit: $SUSFS_COMMIT"; exit 1 ;;
          esac
          [ "${#SUSFS_COMMIT}" = "40" ] || [ "${#SUSFS_COMMIT}" = "64" ] || {
            echo "::error::commit 长度必须为 40 或 64 位: $SUSFS_COMMIT"; exit 1; }
        fi
        sed -i 's/^custom=.*/custom=true/' config/config
        if [ -n "$SUKISU_COMMIT" ]; then
          sed -i "s|^sukisu=.*|sukisu=$SUKISU_COMMIT|" config/config
          echo "SukiSU 固定提交: $SUKISU_COMMIT"
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          # P2-4 修复：替换侧转义 &，避免 SUSFS_BRANCH 含 & 时被 sed 当作整匹配引用
          SUSFS_BRANCH_REPL="${SUSFS_BRANCH//&/\&}"
          sed -i "s|^${SUSFS_BRANCH_ESC}=.*|${SUSFS_BRANCH_REPL}=$SUSFS_COMMIT|" config/config
          echo "SUSFS 固定提交: $SUSFS_COMMIT"
        fi
        echo "--- config/config 生效内容 ---"
        grep -E "^(custom|sukisu|${SUSFS_BRANCH_ESC})=" config/config || echo "(未匹配到，使用默认分支)"
    - name: 恢复 Release 缓存（可选）
      if: ${{ inputs.use_release_cache }}
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ github.ref_name }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}
        cache_bucket: ccache-cache
        cache_sign_key: ${{ secrets.CACHE_SIGN_KEY }}
    - name: 恢复 ccache 缓存
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
        restore-keys: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-
    - name: 恢复 bazel 磁盘缓存
      if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
      uses: actions/cache@v5
      with:
        path: ~/.cache/bazel
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
        restore-keys: '${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-

          ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-'
    - name: 缓存工具链
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: 'kernel-build-tools

          mkbootimg'
        key: toolchain-${{ runner.os }}-v1
    - name: 构建内核
      id: build
      run: bash scripts/build_kernel.sh --all
      env:
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        KSU_MODE: ${{ inputs.ksu_mode }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        BUILD_TIME: ${{ inputs.build_time }}
        USE_ZRAM: ${{ inputs.use_zram }}
        USE_BBG: ${{ inputs.use_bbg }}
        USE_KPM: ${{ inputs.use_kpm }}
        USE_REKERNEL: ${{ inputs.use_rekernel }}
        CVE_2026_43499_PATCH: ${{ inputs.cve_2026_43499_patch }}
        EXPORT_SUSFS_PATCHES: ${{ inputs.export_susfs_patches }}
        EXPECTED_KPM_PATCH_SHA256: ${{ inputs.kpm_patch_sha256 }}
        ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        SUPP_OP: ${{ inputs.supp_op }}
        DROIDSPACES: ${{ inputs.droidspaces }}
        DROIDSPACES_NTSYNC: ${{ inputs.droidspaces_ntsync }}
        ARTIFACT_UPLOAD_MODE: ${{ inputs.artifact_upload_mode }}
        USE_BBR: ${{ inputs.use_bbr }}
        SUKISU_COMMIT: ${{ inputs.sukisu_commit }}
        KSU_BRANCH_MODE: ${{ inputs.ksu_branch_mode }}
        TOOLCHAIN_CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
        WORKSPACE: ${{ github.workspace }}
    - name: 保存 Release 缓存（可选）
      if: ${{ inputs.use_release_cache && !cancelled() }}
      uses: ./.github/actions/cache-save
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ github.ref_name }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}
        cache_bucket: ccache-cache
        github_token: ${{ secrets.GITHUB_TOKEN }}
        cache_sign_key: ${{ secrets.CACHE_SIGN_KEY }}
    - name: 上传编译失败日志
      # A-3：原为 always()，构建成功时也会上传 Build-Logs，
      # 而汇总 job 全量下载后把它当内核产物传上 Release。只在失败时上传。
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
        path: build-logs/
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 9
    - name: 上传 SUSFS 集成补丁
      if: success() && env.SUSFS_PATCH_EXPORT == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: SUSFS-Patch-${{ inputs.ksu_variant }}-${{ env.CONFIG }}-${{ inputs.os_patch_level }}
        path: susfs-patch/
        if-no-files-found: warn
        compression-level: 9
    - name: 上传 AnyKernel3 刷入包
      if: inputs.artifact_upload_mode != '上传全部'
      uses: actions/upload-artifact@v6
      with:
        # A-1 闭环：stage_prepare_anykernel3 生成的 zip 落在 workspace 根（../$_zip），
        # 不在 AnyKernel3/ 目录内。上传「上传全部」分支已用 '*AnyKernel3.zip' 收集，
        # 此处必须一致，否则 zip 生成后被静默丢弃，用户仍拿不到可刷包。
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
        path: '*AnyKernel3.zip'
        if-no-files-found: warn
        compression-level: 9
    # 「上传全部」拆成两个产物：刷入包(~17MB)与启动镜像(~50MB)分开，
    # 避免下载一个 70MB 的压缩包只为拿 AnyKernel3.zip
    - name: 上传 AnyKernel3 刷入包
      if: inputs.artifact_upload_mode == '上传全部'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
        path: '*AnyKernel3.zip'
        if-no-files-found: warn
        compression-level: 9
    - name: 上传启动镜像
      if: inputs.artifact_upload_mode == '上传全部'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Images
        path: '*.img'
        if-no-files-found: warn
        compression-level: 9
    - name: 上传补丁冲突文件
      if: always() && env.REJ_COUNT > 0
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
    - name: 发送 Telegram 通知
      if: ${{ inputs.send_telegram }}
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        KSU_MODE: ${{ inputs.ksu_mode }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        BUILD_TIME: ${{ inputs.build_time }}
        USE_ZRAM: ${{ inputs.use_zram }}
        USE_BBG: ${{ inputs.use_bbg }}
        USE_KPM: ${{ inputs.use_kpm }}
        USE_REKERNEL: ${{ inputs.use_rekernel }}
        CVE_2026_43499_PATCH: ${{ inputs.cve_2026_43499_patch }}
        EXPORT_SUSFS_PATCHES: ${{ inputs.export_susfs_patches }}
        ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        SUPP_OP: ${{ inputs.supp_op }}
        DROIDSPACES: ${{ inputs.droidspaces }}
        DROIDSPACES_NTSYNC: ${{ inputs.droidspaces_ntsync }}
        ARTIFACT_UPLOAD_MODE: ${{ inputs.artifact_upload_mode }}
        USE_BBR: ${{ inputs.use_bbr }}
        WORKSPACE: ${{ github.workspace }}
      run: python3 scripts/telegram_notify.py single || true
