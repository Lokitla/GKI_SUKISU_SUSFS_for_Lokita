name: GetManager
permissions:
  contents: read   # 仅读取仓库内容（下载管理器 APK，本作业不推送 tag）
  actions: read    # 允许读取 actions 产物

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      manager_spoofed:
        description: "是否一并拉取 Spoofed（伪装官方包名）管理器；关闭则只保留普通管理器"
        required: false
        type: boolean
        default: true
      ksu_branch_mode:
        description: "SukiSU 内核侧拉取的分支：auto/main/builtin。管理器始终来自 main，此参数仅用于日志与版本基准说明"
        required: false
        type: string
        default: "auto"
      sukisu_commit:
        description: "SukiSU 提交 hash：管理器与内核统一使用该 commit（留空则取 config/config 的 sukisu=，再留空则用最新）"
        required: false
        type: string
        default: ""
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KSU_BRANCH_MODE: ${{ inputs.ksu_branch_mode }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.repository }}"
          echo "  - Calling Workflow:  ${{ github.workflow }}"
          echo "  - Called Workflow:   get-manager.yml"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      # 读取 config/config 里的自定义提交配置，使管理器的版本选取
      # 与内核构建使用的 SukiSU 提交保持一致（此前管理器永远跟随最新提交）。
      - name: 检出本仓库配置
        uses: actions/checkout@v6
        with:
          sparse-checkout: config
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: 解析自定义提交配置
        id: custom_cfg
        run: |
          ENABLED=false
          COMMIT=""
          if [ -f config/config ]; then
            ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2- | tr -d '\r' | xargs)
            COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2- | tr -d '\r' | xargs)
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "自定义提交配置: enabled=$ENABLED sukisu=${COMMIT:-<未指定>}"

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        env:
          # 安全：外部输入一律经 env 传入，run 块中不得出现 ${{ }}
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
          SUKISU_COMMIT_INPUT: ${{ inputs.sukisu_commit }}
          CUSTOM_ENABLED: ${{ steps.custom_cfg.outputs.enabled }}
          CUSTOM_COMMIT: ${{ steps.custom_cfg.outputs.commit }}
        run: |

          if [ "$KSU_VARIANT" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "$KSU_VARIANT" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 5da529942987b834c2b02a4819eaa298a8383bf4
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "$KSU_VARIANT" == "ReSukiSU" ]; then
            echo "This is the ReSukiSU variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          elif [ "$KSU_VARIANT" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          # 统一 SukiSU 提交：优先用输入项，其次 config/config 的 sukisu=
          SUKISU_COMMIT="$SUKISU_COMMIT_INPUT"
          if [ -z "$SUKISU_COMMIT" ] && [ "$CUSTOM_ENABLED" = "true" ]; then
            SUKISU_COMMIT="$CUSTOM_COMMIT"
          fi
          SUKISU_COMMIT=$(echo "$SUKISU_COMMIT" | xargs)

          # 管理器 APK 只能来自 main 分支：builtin 是只含 kernel/ 与 uapi/ 的独立分支，
          # 连 manager/ 目录都没有，不存在可用的 Manager CI 产物。
          # 因此这里只 fetch 被钉的 commit（用于溯源/校验），绝不 checkout 到它——
          # 一旦切到 builtin，工作区会失去 manager/ 等目录，且提交数基准从 main 的
          # 3737 变成 builtin 的 802，算出的版本号与内核不一致，管理器启动即闪退。
          if [ -n "$SUKISU_COMMIT" ] && [ "$KSU_VARIANT" = "SukiSU" ]; then
            echo "SukiSU 指定提交: $SUKISU_COMMIT（仅 fetch 校验，工作区保持 main）"
            if ! git -C KernelSU fetch --no-tags origin "$SUKISU_COMMIT" >/dev/null 2>&1; then
              echo "::warning::无法获取 SukiSU 提交 $SUKISU_COMMIT，继续按 main 处理"
            fi
          fi
          # 显式拉取 main 引用，供后续按 main 计数使用
          git -C KernelSU fetch --no-tags origin main:refs/remotes/origin/main >/dev/null 2>&1 || true
          echo "SUKISU_COMMIT=$SUKISU_COMMIT" >> "$GITHUB_ENV"

          cd KernelSU

          # 计算KSU版本号。
          # 基准固定为 main 分支的提交数，与内核侧 setup.sh 产出的版本口径一致。
          if [ "$KSU_VARIANT" == "SukiSU" ]; then
            KSU_GIT_VERSION=$(git rev-list --count refs/remotes/origin/main 2>/dev/null || git rev-list --count HEAD)
            echo "SukiSU: main 分支提交数 = $KSU_GIT_VERSION（分支模式输入: $KSU_BRANCH_MODE）"
          else
            KSU_GIT_VERSION=$(git rev-list --count HEAD)
          fi

          if [ "$KSU_VARIANT" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            KSU_VERSION=40726
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "$KSU_VARIANT" == "ReSukiSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "$KSU_VARIANT" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "$KSU_VARIANT" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          if [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0"
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          case "$KSU_VARIANT" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_DIR="SukiSU_40726" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 $KSU_VARIANT 管理器..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "未找到 $KSU_VARIANT 管理器下载地址。"
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "$KSU_VARIANT" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "$KSU_VARIANT" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "$KSU_VARIANT" == "ReSukiSU" ]; then
            echo "ReSukiSU..."
            REPO="ReSukiSU/ReSukiSU"
            KSUM="manager"
          elif [ "$KSU_VARIANT" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "$KSU_VARIANT" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            # Manager CI 只跑在 main 上，必须按 main 的计数口径算。
            # 若该 commit 属于 builtin（独立分支，提交数仅 802），直接计数会得到
            # 远低于实际的版本号，从而把"候选管理器版本"误判为低于内核版本，
            # 最终选中一个过旧的 APK。
            if [ "$KSU_VARIANT" = "SukiSU" ] && \
               git -C KernelSU cat-file -e refs/remotes/origin/builtin^{commit} 2>/dev/null && \
               git -C KernelSU merge-base --is-ancestor "$head_sha" refs/remotes/origin/builtin 2>/dev/null; then
              git_version=$(git -C KernelSU rev-list --count refs/remotes/origin/main)
            else
              git_version=$(git -C KernelSU rev-list --count "$head_sha")
            fi

            if [ "$KSU_VARIANT" = "SukiSU" ] && ! [ "$git_version" -gt 802 ] 2>/dev/null; then
              echo "::warning::$head_sha 的提交数 $git_version 低于 builtin 规模，疑似计数基准错误，跳过该构建" >&2
              return 1
            fi

            case "$KSU_VARIANT" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "ReSukiSU") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          # [融合] Spoofed（伪装官方 KernelSU 包名）管理器开关
          #   开启：一并拉取 Spoofed-Manager（伪装官方包名的管理器）
          #   关闭：过滤掉所有名字含 spoofed 的产物，只保留普通管理器
          WANT_SPOOFED="${{ inputs.manager_spoofed }}"
          case "$WANT_SPOOFED" in
            true|TRUE|True|1) JQ_SPOOFED=true ;;
            *) JQ_SPOOFED=false ;;
          esac
          echo "拉取 Spoofed 管理器: $JQ_SPOOFED"

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "$KSU_VARIANT" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r --arg name "$KSUM" --argjson sp "$JQ_SPOOFED" \
                '.artifacts[] | select(.name == $name) | select($sp or ((.name | ascii_downcase) | contains("spoofed") | not)) | "\(.name)\t\(.archive_download_url)"'
            elif [ "$KSU_VARIANT" == "ReSukiSU" ]; then
              printf '%s' "$artifacts" | jq -r --argjson sp "$JQ_SPOOFED" \
                '.artifacts[] | select(.name == "Manager-release" or ($sp and .name == "Spoofed-Manager-release")) | "\(.name)\t\(.archive_download_url)"'
            else
              # 排除 -gradle / -mappings 中间产物：它们与最终 APK 同名同尺寸，
              # 一并下载会让最终产物里混入未签名的中间 APK（每个变体多出一个）。
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" --argjson sp "$JQ_SPOOFED" \
                '.artifacts[]
                 | select((.name | ascii_downcase) | contains($needle))
                 | select((.name | ascii_downcase) | (endswith("gradle") or endswith("mappings")) | not)
                 | select($sp or ((.name | ascii_downcase) | contains("spoofed") | not))
                 | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=30"
          if [ "$KSU_VARIANT" == "Next" ]; then
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=$BRANCH&status=success&per_page=30"
          fi

          # 指定了 SukiSU 提交时，直接定位该提交触发的 Manager 构建：
          # Manager CI 的 head_sha 就是 SukiSU 的提交，因此可精确命中，
          # 保证管理器与内核完全来自同一个 commit。
          if [ -n "$SUKISU_COMMIT" ] && [ "$KSU_VARIANT" = "SukiSU" ]; then
            echo "按指定提交 $SUKISU_COMMIT 精确查找 Manager 构建..."
            PINNED_RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?head_sha=$SUKISU_COMMIT&status=success&per_page=5")
            PINNED_ID=$(printf '%s' "$PINNED_RUNS" | jq -r '.workflow_runs[0].id // empty')
            if [ -n "$PINNED_ID" ]; then
              ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$PINNED_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -n "$CANDIDATE_LIST" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_BUILD_ID="$PINNED_ID"
                BEST_BRANCH="pinned"
                echo "命中指定提交的 Manager 构建: $PINNED_ID"
              else
                echo "::warning::提交 $SUKISU_COMMIT 的构建 $PINNED_ID 中没有匹配的 Manager 产物，回退按版本查找"
              fi
            else
              echo "::warning::提交 $SUKISU_COMMIT 没有成功的 Manager 构建，回退按版本查找（将取不高于该版本的最新产物）"
            fi
          fi

          if [ -z "$DOWNLOAD_LIST" ]; then
          echo "开始查找不高于 KSU $TARGET_KSU_VERSION 的 Manager 产物..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                echo "候选 Manager: 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi

              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                break 2
              fi
            done
          done
          fi

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact 下载地址列表。"
            exit 1
          fi
          echo "选择 Manager 构建 $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"

          # 下载并解压所有 Manager 产物
          echo "$DOWNLOAD_LIST" | while IFS=$'\t' read -r NAME URL; do
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            ZIP_NAME="$KSU_VARIANT-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
            echo "下载 $NAME -> $ZIP_NAME"
            curl -L -H "Authorization: token $GH_TOKEN" -o "$ZIP_NAME" "$URL"
            mkdir -p "manager-artifacts/$SAFE_NAME"
            unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME"
            rm -rf "$ZIP_NAME"
          done

          if [ "$KSU_VARIANT" == "ReSukiSU" ]; then
            echo "仅保留 ReSukiSU arm64-v8a release 管理器..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "未找到 ReSukiSU arm64-v8a release 管理器。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          case "$KSU_VARIANT" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_SUSFS_VERSION="v2.1.0" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 $KSU_VARIANT 对应的 SUSFS 模块..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> $GITHUB_ENV
            exit 0
          fi

          BUILD_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"

          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token $GH_TOKEN" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载.zip"


          # 解压 artifact zip 获取里面的模块文件
          mkdir -p susfs-module
          unzip "$NAME" -d susfs-temp

          # 检查解压后的内容：如果是散装文件则打包成 zip
          cd susfs-temp
          if ls *.zip 1>/dev/null 2>&1; then
            # 里面已经是 zip 文件，直接移动
            mv *.zip ../susfs-module/
          else
            # 是散装文件，打包成 zip
            zip -r "../susfs-module/ksu_module_susfs.zip" .
          fi
          cd ..
          rm -rf susfs-temp "$NAME"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      # [融合] 按 APK 路径/文件名是否含 spoofed 分流，
      # 让普通管理器与 Spoofed（伪装官方包名）管理器成为两个独立产物，
      # 而不是混在一个压缩包里。
      - name: 分流管理器 APK
        if: steps.add_KSU.outcome == 'success'
        run: |
          rm -rf manager-out manager-out-spoofed
          mkdir -p manager-out manager-out-spoofed
          find manager-artifacts -type f -name "*.apk" | while IFS= read -r f; do
            case "$f" in
              *[Ss]poofed*) cp -f "$f" "manager-out-spoofed/$(basename "$f")" ;;
              *) cp -f "$f" "manager-out/$(basename "$f")" ;;
            esac
          done
          echo "--- 普通管理器 ---"
          ls -1 manager-out || true
          echo "--- Spoofed 管理器 ---"
          ls -1 manager-out-spoofed || true

          # 每个变体预期只应有 1 个 APK；多出来说明上游又新增了同名的中间产物，
          # 这类 APK 通常是未正式签名的，不能混进刷机包。
          for d in manager-out manager-out-spoofed; do
            cnt=$(find "$d" -type f -name "*.apk" | wc -l)
            if [ "$cnt" -gt 1 ]; then
              echo "::warning::$d 中发现 $cnt 个 APK（预期 1 个），请检查上游 Manager 产物是否新增了中间产物："
              find "$d" -type f -name "*.apk" -printf "  %p\n"
            fi
          done

      - name: 上传管理器 APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: manager-out/*.apk
          if-no-files-found: warn

      - name: 上传 Spoofed 管理器 APK
        if: steps.add_KSU.outcome == 'success' && inputs.manager_spoofed
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Spoofed-Manager(${{ env.KSU_VERSION }})
          path: manager-out-spoofed/*.apk
          if-no-files-found: warn

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
