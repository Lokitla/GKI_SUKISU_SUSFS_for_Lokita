name: Update Data & Deploy Pages

on:
  schedule:
    - cron: '0 8 */3 * *'  # 每 3 天 UTC 8:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'web/**'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      data-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental update
        working-directory: scripts
        run: |
          # Exit 0 = data changed, 2 = no changes, 1 = real error
          python update_data.py && exit_code=0 || exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "::error::update_data.py failed with an error"
            exit 1
          fi

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore: update GKI kernel version data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    # [融合] 原为硬编码上游仓库，fork 后 Pages 部署永不执行；改为当前仓库即可
    if: ${{ contains(fromJSON('["zzh20188/GKI_KernelSU_SUSFS", "Lokitla/GKI_SUKISU_SUSFS_for_Lokita"]'), github.repository) }}
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 上游写死 ref: dev，但本仓库没有 dev 分支（只有 main / sha），checkout 直接失败。
      # 改为跟随触发分支，仓库改名或换默认分支都不会再踩坑。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest data
        run: git pull origin ${{ github.ref_name }}

      - name: Copy data to web directory
        run: cp -r data/ web/data/

      # 构建前端资源（webpack 打包 JS/SCSS → dist/）
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets
        working-directory: web
        run: npm ci && npx webpack --mode production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
