name: 实验-5.10.236（NoMount ON / Re-Kernel OFF）

# =============================================================================
# 实验 B：只开 NoMount，Re-Kernel 保持关闭。
# 与实验 A（build-fixed-236-rek-nm.yml）唯一的区别是 use_rekernel=false。
#
# 两组对照：
#   A  build-fixed-236-rek-nm.yml   Re-Kernel ON  + NoMount ON
#   B  build-fixed-236-nm-only.yml  Re-Kernel OFF + NoMount ON   ← 本文件
#   基线 build-fixed-236.yml        Re-Kernel OFF + NoMount OFF（Images 51.07 MiB）
#
# A−B 的差值就是 Re-Kernel 单独贡献的代码体积；B−基线 就是 NoMount 的。
#
# 参数与基线完全一致，只改开关。单独开文件而不是改基线：
# 基线是长期对照组，改了它历史产物就失去可比性。
#
# 注意 NoMount 需要自行刷入配套 NoMount 模块才能生效，这里只验证编译。
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 与实验 A 各自独立，避免互相取消
concurrency:
  group: exp-236-nm-only
  cancel-in-progress: false

jobs:
  build-fixed:
    name: "5.10.236 / NoMount only"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "236"
      os_patch_level: "2025-05"
      revision: "r1"
      ksu_variant: "SukiSU"
      # ksu_mode 不传：build.yml 默认「关闭」= 正常集成 KernelSU
      version: "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
      build_time: "Tue Oct 21 03:03:12 UTC 2025"
      use_zram: true
      use_bbr: true
      use_bbg: false
      use_kpm: "patched (开启并修补)"
      use_rekernel: false
      use_nomount: true
      cve_2026_43499_patch: false
      enable_susfs: true
      export_susfs_patches: true
      supp_op: false
      droidspaces: "不启用"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"
      send_telegram: false
      use_release_cache: false
      sukisu_commit: ""
      susfs_commit: ""
      kpm_patch_sha256: ""

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: "SukiSU"
      manager_spoofed: true
      sukisu_commit: ""
