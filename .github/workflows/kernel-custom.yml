name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
        default: ReSukiSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式（关闭 = 不禁用任何项，即 KSU + SUSFS 全开，默认；禁用SUSFS = 只集成 KSU、不打 SUSFS 补丁；禁用KSU = 纯净 GKI，KSU 与 SUSFS 都不集成）"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（enabled = 开启 CONFIG_KPM；patched = 开启并修补镜像，本项目未实现该修补，选它等同于 enabled）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      os_patch_level:
        description: "构建目标：可填子版本代号（如 66、236）或补丁级别日期（如 2022-01）；lts = LTS 版本；all = 该内核全部版本（耗时很长）；也可用逗号分隔多个（如 66,236,2022-01）。默认只构建一个版本。"
        required: true
        type: string
        default: "2022-01"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

      use_bbr:
        description: "设置 BBR 为默认 TCP 拥塞算法（融合自 ShirkNeko）"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "构建结束后发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: false
      use_release_cache:
        description: "用 GitHub Release 存储 ccache（融合自 ShirkNeko）"
        required: false
        type: boolean
        default: false
      manager_spoofed:
        description: "一并拉取 Spoofed（伪装官方包名）管理器"
        required: false
        type: boolean
        default: true
jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          entries = data.get("entries", [])
          prefix = f"{kernel_version}."

          # 供错误提示使用：列出该内核全部可用子版本代号
          available_subs = []
          for entry in entries:
              k = entry.get("kernel", "")
              if k.startswith(prefix):
                  s = k.rsplit(".", 1)[-1]
                  if s not in available_subs:
                      available_subs.append(s)
          available_hint = "子版本代号: " + ", ".join(available_subs)

          # ---------- 解析用户请求的补丁级别列表 ----------
          # 支持：all / lts / latest / 单个日期 / 逗号分隔多个日期
          mode = os_patch_level.lower()
          if mode == "all":
              # 同一内核版本可能被多个补丁级别复用（如 5.10.43 对应 2021-08/09/10），
              # 这里按内核版本去重，只保留该版本最新的那个补丁级别。
              newest_date_by_kernel = {}
              for entry in entries:
                  k = entry.get("kernel", "")
                  if k:
                      newest_date_by_kernel[k] = entry.get("date")
              try:
                  ordered = sorted(
                      newest_date_by_kernel.items(),
                      key=lambda kv: int(kv[0].rsplit(".", 1)[-1]),
                  )
              except ValueError:
                  ordered = list(newest_date_by_kernel.items())
              wanted = [d for _, d in ordered]
              if data.get("lts"):
                  wanted.append("lts")
          elif mode == "latest":
              wanted = [entries[-1].get("date")] if entries else []
          else:
              wanted = [p.strip() for p in os_patch_level.split(",") if p.strip()]

          include = []
          seen = set()
          for patch in wanted:
              if patch.lower() == "lts":
                  kernel_full = data.get("lts")
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                      sys.exit(1)
                  item = {"sub_level": "X", "os_patch_level": "lts", "kernel_full": kernel_full}
              else:
                  # 既支持补丁级别日期（2022-01），也支持子版本代号（66 / 236）
                  if patch.isdigit():
                      candidates = [
                          entry for entry in entries
                          if entry.get("kernel") == f"{kernel_version}.{patch}"
                      ]
                      if not candidates:
                          print(f"::error::未找到 {android_version} / {kernel_version}.{patch} 对应的版本数据")
                          print(f"::error::{available_hint}")
                          sys.exit(1)
                      # 同一子版本可能对应多个补丁级别，取最新的那个
                      matched = candidates[-1]
                  else:
                      matched = next(
                          (entry for entry in entries if entry.get("date") == patch),
                          None,
                      )
                      if matched is None:
                          print(f"::error::未找到 {android_version} / {kernel_version} / {patch} 对应的版本数据")
                          print(f"::error::可填补丁级别日期（如 2022-01）或子版本代号（如 66）")
                          print(f"::error::{available_hint}")
                          sys.exit(1)
                  kernel_full = matched.get("kernel", "")
                  if not kernel_full.startswith(prefix):
                      print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                      sys.exit(1)
                  item = {
                      "sub_level": kernel_full.rsplit(".", 1)[-1],
                      "os_patch_level": matched.get("date"),
                      "kernel_full": kernel_full,
                  }
              key = (item["sub_level"], item["os_patch_level"])
              if key in seen:
                  continue
              seen.add(key)
              include.append(item)

          if not include:
              print(f"::error::未能解析出任何构建目标，请检查 os_patch_level: {os_patch_level}")
              sys.exit(1)

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              # 兼容旧引用：取第一个目标
              output.write(f"sub_level={include[0]['sub_level']}\n")
              output.write(f"kernel_full={include[0]['kernel_full']}\n")
              output.write("matrix<<__MATRIX_EOF__\n")
              output.write(json.dumps(matrix, ensure_ascii=False))
              output.write("\n__MATRIX_EOF__\n")

          print(f"解析结果: {android_version} / {kernel_version}，共 {len(include)} 个构建目标")
          for item in include:
              print(f"   - {item['kernel_full']}  ({item['os_patch_level']})")
          PY

  build-custom-kernel:
    name: "${{ matrix.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ matrix.os_patch_level }}"
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-version.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      use_bbr: ${{ inputs.use_bbr || false }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      spoofed: ${{ inputs.manager_spoofed }}
