name: 固定构建-5.10.236-builtin_08-27（对照组）

# =============================================================================
# 对照用的固定构建：把 SukiSU 钉到 builtin 上【2026-08-27 的那个正常提交】。
#
#   build-fixed-236.yml       留空 → builtin HEAD b20dee702035（09-13）
#   build-fixed-236-prev.yml  钉 6c5603f0c853...（08-27）                ← 本文件
#
# 为什么选 08-27 这个 commit（而不是上一个 e2912817f4e1）：
#   上游 d13e8a75f818（09-01，"Sync with the official KernelSU main repo"）在同步时
#   误删了 kernel_umount.c 里的 kernel_umount_feature_set 函数体，但保留了引用它的
#   feature handler —— 实现没了、调用还在，builtin 分支从 09-01 到 09-13 整整 12 天
#   编译不过。09-13 的 b20dee702035（#964 "restore missing kernel_umount_feature_set"）
#   才把这 8 行加回来。
#
#   所以 builtin 的血缘是这样的：
#     6c5603f0c853 (08-27, fix 2)          ← broken 之前最后一个正常提交，本文件钉它
#       └ d13e8a75f818 (09-01, sync)       ← 误删，构建开始 broken
#         └ e2912817f4e1 (09-01, bump)     ← 仍 broken（只改 Makefile）
#           └ b20dee702035 (09-13, #964)   ← 修复
#
#   这也是第二个对照组（钉 e2912817f4e1）必然失败于 compile_kernel 的原因：它退到了
#   broken 窗口里。而 6c5603f0c853 在窗口之前，理论上可编译。
#
# 预期版本号仍然不变：KSU 版本 = 40000 + main 提交数 − 2815，输入是 main 的提交数，
# 跟内核 checkout 到 builtin 的哪个点无关（resolve_sukisu_version 强制按 main 取数）。
#
# 不发 Release：直接 uses: build.yml，绕开含 gh release create 的 main.yml 编排层。
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fixed-build-236-prev
  cancel-in-progress: false

jobs:
  build-fixed:
    name: "5.10.236-android12-2025-05 [prev]"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "236"
      os_patch_level: "2025-05"
      revision: "r1"
      ksu_variant: "SukiSU"
      version: "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
      build_time: "Tue Oct 21 03:03:12 UTC 2025"
      use_zram: true
      use_bbr: true
      use_bbg: false
      use_kpm: "patched (开启并修补)"
      use_rekernel: false
      cve_2026_43499_patch: false
      enable_susfs: true
      export_susfs_patches: true
      supp_op: false
      droidspaces: "不启用"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"
      send_telegram: false
      use_release_cache: false
      # ↓↓↓ 本文件唯一的实验变量 ↓↓↓
      # 必须是完整 40 位 SHA-1，短 hash 会被长度校验直接判非法并中断构建。
      sukisu_commit: "6c5603f0c853a94256940273efc433cbbc85f57a"
      susfs_commit: ""
      kpm_patch_sha256: ""

  # 管理器刻意不跟内核一起钉这个 commit：
  #   6c5603f0c853 属于 builtin 分支，而 builtin 里没有 manager/ 目录，上游也不会用
  #   builtin 的 head_sha 跑 build-manager.yml —— 把 builtin 的 hash 传到这里，
  #   head_sha 精确查找必然落空（两条分支无共同祖先）。
  #   留空走自动查找 + 严格对齐即可：现在应该稳定命中 Build Manager #2681
  #   （2026-09-13 / head 7755cdb36f63 / KSU 40922）。
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: "SukiSU"
      manager_spoofed: true
      sukisu_commit: ""
