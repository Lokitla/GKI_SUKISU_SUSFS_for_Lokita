name: 自用构建-5.10.236（ReSukiSU / marble）

# =============================================================================
# 【自用】参数全写死，不带任何 inputs，触发即跑固定配置。
#   适配机型：Redmi Note 12 Turbo（代号 marble），android12 / 5.10.236。
#   启用项：
#     - ReSukiSU + SUSFS（一并导出补丁）
#     - zram（LZ4KD）
#     - 网络增强：IPSet 全类型 + BBR + FQ/FQ_CODEL + IPv6 NAT + 附加拥塞算法
#     - Re-Kernel（rek）启用
#     - NoMount 挂载元模块启用
#   版本名与构建时间固定为伪装串（见下方 with: 的 version / build_time）。
#
# 为什么单独开一个文件、而不是给 kernel-custom.yml 传参：
#   kernel-custom.yml 需要手填 os_patch_level 等一整串下拉框，而它的
#   workflow_dispatch 份额已被 Auto_Trigger 占满（GitHub 上限 25 个 input，
#   main.yml 那次超限导致 dispatch 被 422 拒掉就是栽在这上面）。
#   这里把配置直接沉进文件，auto 只要 dispatch 一次即可，不必逐项传参。
#
# 本文件由 build-fixed-236.yml 改名而来，参数在它的基础上把
#   use_rekernel / use_net_enhance / use_nomount 三项从 false 改为 true。
#
# 三项开关在 scripts/build_kernel.sh 里都是纯布尔量、没有变体门控，
# ReSukiSU 下会真实参与构建，不存在"写了但被跳过"的情况：
#   use_rekernel     -> stage_apply_rekernel（build_kernel.sh:2187）
#   use_net_enhance  -> stage_config_net_enhance（build_kernel.sh:2194）
#                       内含写后校验：DEFAULT_BBR / IP_SET / NET_SCH_FQ 等
#                       任一符号未落盘会直接失败，不会静默降级
#   use_nomount      -> stage_integrate_nomount（build_kernel.sh:1579）
#                       从 maxsteeel/nomount 的 dev 分支拉 setup.sh，
#                       收尾校验 fs/nomount 软链接存在
# 若首次实机构建遇到某一项报不兼容、又不想让整轮白跑，把
# skip_incompatible 改成 true 即可降级为 warning 继续。
#
# 网络增强已包含"把 BBR 设为默认拥塞算法"，use_bbr 仍保留为 true 只是让
# config_kernel 阶段也走一遍同样的写入（幂等，二者共用 ensure_bbr_cfg /
# ensure_net_cfg，不会重复追加）。
#
# ReSukiSU 内核不提供 KPM，use_kpm 的「patched」不会写进 defconfig，
# KPM 修补阶段也会被跳过——这是变体限制，不是配置失效。
#
# 不发 Release（这是刻意的设计，不是遗漏）：
#   Release 由 main.yml 编排层的 gh release create/upload 负责
#   （main.yml:973-1022）。本 workflow 直接 uses: build.yml ——
#   build.yml 内部只有 actions/upload-artifact，没有任何 release 步骤，
#   因此产物只留在 Actions artifacts 里，不会生成 Release。
#
# kpm_patch_sha256 留空是有意的：build_kernel.sh 在锚点为空时会回读
# config/kpm_patch_sha256，等价于「始终跟随仓库锚点」，写死反而会漏掉
# 上游变更带来的校验。
#
# 注意：本文件被 .github/workflows/Auto_Trigger.yml 的「固定 5.10.236」
# 分支硬引用（TARGET_WF），改名或删除前必须同步改那一行，否则自动触发会
# 因找不到 workflow 而 404。
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 触发就是跑一次内核构建，没必要互相取消
concurrency:
  group: marble-build-236
  cancel-in-progress: false

jobs:
  build-marble:
    name: "5.10.236-android12-2025-05"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "236"
      os_patch_level: "2025-05"
      revision: "r1"
      ksu_variant: "ReSukiSU"
      # ksu_mode 不传：build.yml 默认「关闭」= 正常集成 KernelSU
      version: "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
      build_time: "Tue Oct 21 03:03:12 UTC 2025"
      use_zram: true
      use_bbr: true
      use_bbg: false
      use_kpm: "patched (开启并修补)"
      use_rekernel: true
      use_net_enhance: true
      use_nomount: true
      cve_2026_43499_patch: false
      skip_incompatible: false
      enable_susfs: true
      export_susfs_patches: true
      supp_op: false
      droidspaces: "不启用"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"
      send_telegram: false
      use_release_cache: false
      sukisu_commit: ""
      susfs_commit: ""
      kpm_patch_sha256: ""

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: "ReSukiSU"
      manager_spoofed: true
      sukisu_commit: ""
