name: 内核构建 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - Official
          - Next
        default: SukiSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image，6.6 内核不支持）"
        required: true
        type: choice
        default: "patched (开启并修补)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "不启用"
          - "678"
          - "123"
          - "345"
        default: "不启用"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      manager_spoofed:
        description: "一并拉取 Spoofed 管理器（伪装包名）"
        required: false
        type: boolean
        default: true
      use_bbr:
        description: "设置 BBR 为默认拥塞算法"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: choice
        options:
          - "auto"
          - "main"
          - "builtin"
        default: "auto"
      kpm_patch_sha256:
        description: "KPM 修补工具(patch_linux)的 sha256 锚点：传给 build_kernel.sh 做 fail-closed 比对，不符即拒绝执行（留空则不校验）"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
        required: false
        type: choice
        options:
          - "关闭"
          - "禁用KSU"
        default: "关闭"
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      droidspaces:
        required: false
        type: string
        default: "不启用"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

      use_bbr:
        description: "设置 BBR 为默认拥塞算法"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      manager_spoofed:
        description: "一并拉取 Spoofed 管理器（伪装包名）"
        required: false
        type: boolean
        default: true
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      kpm_patch_sha256:
        description: "KPM 修补工具(patch_linux)的 sha256 锚点：传给 build_kernel.sh 做 fail-closed 比对，不符即拒绝执行（留空则不校验）"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
        required: false
        type: string
        default: "关闭"
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
jobs:
  prepare-matrix:
    name: "生成构建矩阵"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      # 自动更新（由 main.yml 调用）只编裁剪矩阵；手动触发编全量矩阵。
      # 两者数据都来自 .github/workflows/config/matrix.json。
      - name: 生成构建矩阵
        id: gen
        env:
          MODE: ${{ inputs.called_from_main && 'auto' || 'full' }}
        run: python3 scripts/gen_matrix.py --mode "$MODE" --android android13 --github-output

  build-kernels-a13-5-15:
    needs: prepare-matrix
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        # 矩阵改由 .github/workflows/config/matrix.json 生成（19 组合）
        # 本轮维护范围：仅保留仍在实机使用的子版本，剔除早期已弃用版本
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: false
      enable_susfs: ${{ inputs.enable_susfs }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces || '不启用' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      use_bbr: ${{ inputs.use_bbr || false }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      sukisu_commit: ${{ inputs.sukisu_commit || '' }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      kpm_patch_sha256: ${{ inputs.kpm_patch_sha256 }}
      susfs_commit: ${{ inputs.susfs_commit || '' }}
  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_spoofed: ${{ inputs.manager_spoofed }}
      sukisu_commit: ${{ inputs.sukisu_commit || '' }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
