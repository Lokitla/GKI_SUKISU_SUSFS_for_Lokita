# =============================================================================
# SukiSU 上游更新检测 → 自动触发内核构建
# -----------------------------------------------------------------------------
# 流程：拉取 SukiSU-Ultra/main 最新提交号 → 与 sha 分支记录的旧值比对 →
#       有更新则回写 sha 分支，并按 build_scope 触发构建。
#
# 关于默认范围：默认是「单版本冒烟」，走 kernel-custom 只编 5.10 的一个子版本；
# 而不是一上来就跑满 80 个版本——全量构建会让 80 个任务同时去
# android.googlesource.com 拉内核源码，对上游是实打实的压力，
# 也容易把 Runner 时长烧在一个可能根本编不过的新提交上。
# 确认新提交没问题后，再手动跑「构建内核」选全部版本。
#
# 为什么冒烟选 5.10 而不是 6.12：
#   6.12 子版本最少（4 个），看似最省，但 SukiSU 主线与 6.12 的 LSM hook 签名
#   不兼容（security_add_hooks 第三参数在 6.12 上是 const struct lsm_id *，
#   SukiSU 仍按老签名传字符串），主线版本必然编不过，用它做冒烟只会永远飘红。
#   5.10 是已实测可编的组合，作为「新提交还能不能编过」的信号才有意义。
# =============================================================================
name: Auto Trigger on SukiSU Update

on:
  schedule:
    # 每三天 UTC 00:00 检查一次。GitHub 的 cron 不保证准点，高峰期可能延后数十分钟，属正常现象。
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「是否有新提交」，强制触发一次构建
        type: boolean
        default: false
      build_scope:
        description: 检测到更新后要构建的范围
        type: choice
        default: 单版本冒烟
        options:
          - 单版本冒烟
          - 全部版本
          - 不构建
      release_type:
        description: 构建完成后的发布方式
        type: choice
        default: Release
        options:
          - Release
          - Pre-Release
          - Actions

# 写：回写 sha 分支；actions：调用 workflow_dispatch 接口触发构建
permissions:
  contents: write
  actions: write

# 同一时间只允许一个检测任务在跑，避免定时任务和手动触发互相踩
concurrency:
  group: auto-trigger-sukisu
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    # [融合] 仓库所有者白名单：fork 后需把自己的用户名加进来，否则自动构建永不触发
    if: contains(fromJSON('["zzh20188", "elysias123", "Lokitla"]'), github.repository_owner)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 获取 SukiSU-Ultra 最新提交号
        id: get_sha
        run: |
          set -euo pipefail
          LATEST_SHA=$(curl -fsSL https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/main | jq -r '.sha')
          # API 限流或仓库改名时会拿到空值/null，这时宁可不触发，也不要带着空提交号去构建
          if [[ -z "$LATEST_SHA" || "$LATEST_SHA" == "null" ]]; then
            echo "::error::无法获取 SukiSU 最新提交号（API 限流或接口变更），本次跳过"
            exit 1
          fi
          echo "sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "Latest SHA: $LATEST_SHA"

      - name: 读取 sha 分支记录的旧提交号
        id: get_prev_sha
        run: |
          set -euo pipefail
          PREV_SHA=""
          if git ls-remote --heads origin sha | grep -q sha; then
            echo "sha 分支存在，读取历史记录…"
            git fetch origin sha:sha || true
            git checkout sha || true
            if [ -f "latest_sha.txt" ]; then
              PREV_SHA=$(cat latest_sha.txt)
              echo "Previous SHA found: $PREV_SHA"
            else
              echo "sha 分支上没有 latest_sha.txt"
            fi
          else
            echo "sha 分支尚不存在，视为首次运行"
          fi
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          git checkout "${{ github.ref_name }}"

      - name: 比对是否有新提交
        id: compare
        run: |
          set -euo pipefail
          CURR_SHA="${{ steps.get_sha.outputs.sha }}"
          PREV_SHA="${{ steps.get_prev_sha.outputs.prev_sha }}"
          FORCE="${{ inputs.force || 'false' }}"

          echo "Current SHA: $CURR_SHA"
          echo "Previous SHA: ${PREV_SHA:-<none>}"

          if [[ "$FORCE" == "true" ]]; then
            echo "new_commit=true"
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
            echo "手动强制触发"
          elif [[ "$CURR_SHA" != "$PREV_SHA" ]]; then
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
            echo "检测到新提交"
          else
            echo "new_commit=false" >> "$GITHUB_OUTPUT"
            echo "无新提交"
          fi

      - name: 回写最新提交号到 sha 分支
        if: steps.compare.outputs.new_commit == 'true'
        run: |
          set -euo pipefail
          git checkout sha 2>/dev/null || git checkout --orphan sha
          if [ ! -f "latest_sha.txt" ]; then
            git rm -rf . 2>/dev/null || true
          fi
          echo "${{ steps.get_sha.outputs.sha }}" > latest_sha.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_sha.txt
          git commit -m "chore(sha): 更新 SukiSU 最新提交号为 ${{ steps.get_sha.outputs.sha }}" || exit 0
          git push origin sha

      - name: 触发构建工作流
        if: steps.compare.outputs.new_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: ${{ inputs.build_scope || '单版本冒烟' }}
          RELEASE_TYPE: ${{ inputs.release_type || 'Release' }}
        run: |
          set -euo pipefail

          case "$SCOPE" in
            "不构建")
              echo "本次只更新 sha 分支，不触发构建"
              exit 0
              ;;
            "全部版本")
              # 完整矩阵走「构建内核」(main.yml)
              jq -n \
                --arg ref "${{ github.ref_name }}" \
                --arg release_type "$RELEASE_TYPE" \
                '{
                  ref: $ref,
                  inputs: {
                    release_type: $release_type,
                    kernelsu_variant: "SukiSU",
                    enable_susfs: "true",
                    use_kpm: "enabled (开启)",
                    droidspaces: "不启用",
                    build_time: "",
                    build_all: "true",
                    export_susfs_patches: "true",
                    build_a12_5_10: "false",
                    build_a13_5_15: "false",
                    build_a14_6_1: "false",
                    build_a15_6_6: "false",
                    build_a16_6_12: "false",
                    use_zram: "false",
                    use_bbg: "false",
                    use_rekernel: "false",
                    cve_2026_43499_patch: "false",
                    droidspaces_ntsync: "false",
                    use_bbr: "false",
                    send_telegram: "true",
                    use_release_cache: "false",
                    manager_spoofed: "true",
                    supp_op: "false"
                  }
                }' > /tmp/dispatch.json
              TARGET_WF="main.yml"
              ;;
            *)
              # 单版本冒烟走「Android 内核构建-自定义」(kernel-custom.yml)：
              # 只有它支持精确到单个子版本，一次只编 1 个，几分钟就有结果。
              # 5.10.66 是已实测可编的组合；只传 AnyKernel3 包，省掉三个 boot 镜像。
              jq -n \
                --arg ref "${{ github.ref_name }}" \
                '{
                  ref: $ref,
                  inputs: {
                    kernel_version: "5.10",
                    kernelsu_variant: "SukiSU",
                    enable_susfs: "true",
                    use_kpm: "enabled (开启)",
                    droidspaces: "不启用",
                    artifact_upload_mode: "仅上传 AnyKernel3.zip",
                    build_scope: "指定版本",
                    os_patch_level: "66",
                    build_time: "",
                    use_zram: "false",
                    use_bbg: "false",
                    use_rekernel: "false",
                    cve_2026_43499_patch: "false",
                    supp_op: "false",
                    droidspaces_ntsync: "false",
                    use_bbr: "false",
                    send_telegram: "true",
                    use_release_cache: "false",
                    manager_spoofed: "true"
                  }
                }' > /tmp/dispatch.json
              TARGET_WF="kernel-custom.yml"
              ;;
          esac

          echo "触发范围：$SCOPE → $TARGET_WF"

          # 注意：REST 字段是 inputs（复数）。写成 input 会被 422 拒掉。
          # 这里直接构造 JSON 载荷，避免 -f 嵌套字段写法在不同 gh 版本上的差异。
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/$TARGET_WF/dispatches" \
            --input /tmp/dispatch.json

          echo "已触发 $TARGET_WF"
