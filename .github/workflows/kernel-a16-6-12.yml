name: 内核构建 - Android 16 (6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - Official
          - Next
        default: ReSukiSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image，6.6 内核不支持）"
        required: true
        type: choice
        default: "patched (开启并修补)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "不启用"
          - "启用"
        default: "不启用"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      manager_spoofed:
        description: "一并拉取 Spoofed 管理器（伪装包名）"
        required: false
        type: boolean
        default: true
      use_bbr:
        description: "设置 BBR 为默认拥塞算法"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: choice
        options:
          - "auto"
          - "main"
          - "builtin"
        default: "auto"
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
      kpm_patch_sha256:
        description: "KPM 修补工具 sha256 锚点（留空不校验）"
        required: false
        type: string
        default: ""
      # ksu_mode 已从手动触发界面隐藏：本仓库的存在前提就是集成 KernelSU，
      # 不存在"不集成 KSU"的常规用法。功能代码未删除——build.yml 的
      # workflow_call 仍保留该输入，需要时取消下面注释并恢复 with: 透传即可。
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "不启用"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

      use_bbr:
        description: "设置 BBR 为默认拥塞算法"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      manager_spoofed:
        description: "一并拉取 Spoofed 管理器（伪装包名）"
        required: false
        type: boolean
        default: true
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
      kpm_patch_sha256:
        description: "KPM 修补工具 sha256 锚点（留空不校验）"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
        required: false
        type: string
        default: "关闭"
jobs:
  # 矩阵改由 .github/workflows/config/matrix.json 生成。
  # 自动更新走 auto（6.12 不在其中，故为空、行为等同跳过）；
  # 手动触发走 full（23/30/38/58）。
  prepare-matrix:
    name: "生成构建矩阵"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: 生成构建矩阵
        id: gen
        env:
          MODE: ${{ inputs.called_from_main && 'auto' || 'full' }}
        run: |
          set -euo pipefail
          # auto 模式不含 6.12：脚本会输出空矩阵，下游 build job 的
          # `if: needs.prepare-matrix.outputs.count != '0'` 据此跳过。
          python3 scripts/gen_matrix.py --mode "$MODE" --android android16 --github-output
          if [ "$MODE" = "auto" ]; then
            echo "::notice::6.12 不在自动矩阵（auto 模式），本工作流跳过构建；" \
                 "如需 6.12 请在 main.yml 勾选 build_a16_6_12（Auto_Trigger 勾选 include_612）"
          fi

  build-kernels-a16-6-12:
    needs: prepare-matrix
    name: "6.12.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    if: needs.prepare-matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      # 这里原本写死 false，把 use_zram 的默认值（true）静默盖掉 ——
      # UI 上看着勾了 ZRAM，实际构建却没开。6.12 上 ZRAM 的真实处置交给
      # 脚本：上游 lz4k 补丁栈只到 6.6，没有就整段跳过并告警，别在这里替它决定。
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.enable_susfs }}
      # ksu_mode 不传：build.yml 默认「关闭」（正常集成 KernelSU）。
      droidspaces: ${{ inputs.droidspaces || '不启用' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      use_bbr: ${{ inputs.use_bbr || false }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      sukisu_commit: ${{ inputs.sukisu_commit || '' }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      kpm_patch_sha256: ${{ inputs.kpm_patch_sha256 }}
      susfs_commit: ${{ inputs.susfs_commit || '' }}
  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_spoofed: ${{ inputs.manager_spoofed }}
      sukisu_commit: ${{ inputs.sukisu_commit || '' }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}