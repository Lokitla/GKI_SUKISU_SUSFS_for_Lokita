name: 实验-5.10.236（Re-Kernel ON + NoMount ON）

# =============================================================================
# 实验 A：Re-Kernel 与 NoMount 同时开启。
# 与实验 B（build-fixed-236-nm-only.yml）唯一的区别是 use_rekernel，
# 两者对照可以看清「NoMount 已开时，Re-Kernel 的加入带来什么变化」。
#
# 基线参照：build-fixed-236.yml（两个都关，Images 51.07 MiB）
#
# 参数与基线完全一致，只改这两个开关。单独开文件而不是改基线：
# 基线是长期对照组，改了它历史产物就失去可比性。
#
# 阶段顺序（scripts/build_kernel.sh PHASES）：
#   22 gen_susfs_patch → 24 backup_defconfig → 25 integrate_nomount → 33 apply_rekernel
# NoMount 必须在前两个之后（否则改动被算进 susfs.patch / CONFIG_NOMOUNT 不被
# bazel fragment diff 捕获），Re-Kernel 在最后单独改写 defconfig，互不干扰。
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 与实验 B 各自独立，避免互相取消
concurrency:
  group: exp-236-rek-nm
  cancel-in-progress: false

jobs:
  build-fixed:
    name: "5.10.236 / ReKernel+NoMount"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "236"
      os_patch_level: "2025-05"
      revision: "r1"
      ksu_variant: "SukiSU"
      # ksu_mode 不传：build.yml 默认「关闭」= 正常集成 KernelSU
      version: "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
      build_time: "Tue Oct 21 03:03:12 UTC 2025"
      use_zram: true
      use_bbr: true
      use_bbg: false
      use_kpm: "patched (开启并修补)"
      use_rekernel: true
      use_nomount: true
      cve_2026_43499_patch: false
      enable_susfs: true
      export_susfs_patches: true
      supp_op: false
      droidspaces: "不启用"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"
      send_telegram: false
      use_release_cache: false
      sukisu_commit: ""
      susfs_commit: ""
      kpm_patch_sha256: ""

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: "SukiSU"
      manager_spoofed: true
      sukisu_commit: ""
